<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinelia</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#fff;
  color:#000;
}

header{
  padding:34px 36px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#000;
  text-decoration:none;
  font-size:25px;
  font-weight:700;
}

.menu-btn{
  background:none;
  border:0;
  color:#000;
  font-size:38px;
  line-height:1;
  cursor:pointer;
  padding:0;
}

.mobile-menu{
  display:none;
  position:fixed;
  inset:0;
  background:#fff;
  z-index:999;
  padding:34px 36px 36px;
}

.mobile-menu.active{
  display:block;
}

.mobile-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close-btn{
  background:none;
  border:0;
  color:#000;
  font-size:56px;
  font-weight:300;
  line-height:1;
  cursor:pointer;
  padding:0;
}

.mobile-links{
  height:61vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:58px;
}

.mobile-links a{
  color:#000;
  text-decoration:none;
  font-size:25px;
  font-weight:500;
  line-height:1;
}

.download-area{
  text-align:center;
  margin-top:16px;
}

.download-area p{
  margin:0 0 18px;
  font-size:20px;
  font-weight:700;
}

.ios-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  width:100%;
  max-width:530px;
  background:#000;
  color:#fff;
  text-decoration:none;
  border-radius:999px;
  padding:18px 24px;
  font-size:25px;
  font-weight:700;
}

.page{
  padding:90px 36px;
  text-align:center;
}

.page h1{
  font-size:34px;
  margin:0 0 12px;
}

.page p{
  font-size:18px;
  margin:0;
}

@media(min-width:801px){
  .menu-btn{display:none}

  header{
    padding:28px 60px 0;
  }

  .desktop-nav{
    display:flex;
    gap:28px;
    align-items:center;
  }

  .desktop-nav a{
    color:#000;
    text-decoration:none;
    font-size:15px;
    font-weight:500;
  }

  .desktop-download{
    background:#000;
    color:#fff!important;
    padding:12px 22px;
    border-radius:999px;
  }
}

@media(max-width:800px){
  .desktop-nav{display:none}
}
</style>
</head>

<body>

<header>
  <a class="logo" href="index.html">Clinelia</a>

  <nav class="desktop-nav">
    <a href="index.html">Introduksjon</a>
    <a href="info.html">Informasjon</a>
    <a href="privacy.html">Privacy</a>
    <a href="terms.html">Service</a>
    <a class="desktop-download" href="#">Last ned appen</a>
  </nav>

  <button class="menu-btn" onclick="openMenu()">☰</button>
</header>

<div class="mobile-menu" id="mobileMenu">
  <div class="mobile-top">
    <a class="logo" href="index.html">Clinelia</a>
    <button class="close-btn" onclick="closeMenu()">×</button>
  </div>

  <div class="mobile-links">
    <a href="index.html">Introduksjon</a>
    <a href="info.html">Informasjon</a>
    <a href="privacy.html">Privacy</a>
    <a href="terms.html">Service</a>
  </div>

  <div class="download-area">
    <p>Last ned appen</p>
    <a class="ios-btn" href="#"> Download for iOS</a>
  </div>
</div>

<main class="page">
  <h1>Velkommen til Clinelia</h1>
  <p>Moderne helseløsning gjort enkelt.</p>
</main>

<script>
function openMenu(){
  document.getElementById("mobileMenu").classList.add("active");
}

function closeMenu(){
  document.getElementById("mobileMenu").classList.remove("active");
}
</script>

</body>
</html>
