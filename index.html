<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinelia</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#050505;background:#fff}
.header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);padding:26px 5%}
.navbar{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:26px;font-weight:800;color:#000;text-decoration:none}
.nav{display:flex;align-items:center;gap:34px}
.nav a{color:#000;text-decoration:none;font-size:16px;font-weight:600}
.nav a:hover{opacity:.55}
.download{background:#000!important;color:#fff!important;padding:14px 24px;border-radius:999px}
.menu-btn{display:none;background:none;border:0;font-size:38px;cursor:pointer}
.mobile-menu{display:none;position:fixed;inset:0;background:#fff;z-index:99;padding:34px 7%}
.mobile-top{display:flex;justify-content:space-between;align-items:center}
.close{font-size:54px;background:none;border:0;cursor:pointer}
.mobile-links{height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:46px}
.mobile-links a{font-size:28px;font-weight:700;color:#000;text-decoration:none}
.mobile-download{text-align:center;margin-top:20px}
.mobile-download p{font-weight:800;font-size:20px}
.ios-btn{display:inline-flex;align-items:center;gap:12px;background:#000;color:#fff;text-decoration:none;border-radius:999px;padding:18px 46px;font-size:24px;font-weight:800}
.hero{min-height:calc(100vh - 90px);display:grid;place-items:center;text-align:center;padding:70px 5%}
.hero-card{max-width:900px}
h1{font-size:clamp(46px,8vw,96px);line-height:.95;margin:0 0 24px;font-weight:900;letter-spacing:-3px}
p{font-size:clamp(18px,2vw,24px);line-height:1.7;color:#555;margin:0}
.actions{margin-top:42px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.btn{display:inline-block;text-decoration:none;border-radius:999px;padding:16px 28px;font-weight:800}
.btn-dark{background:#000;color:#fff}
.btn-light{background:#f2f2f2;color:#000}
.footer{text-align:center;color:#777;padding:40px 20px}
@media(max-width:800px){
.header{padding:32px 7%}
.logo{font-size:28px}
.nav{display:none}
.menu-btn{display:block}
.mobile-menu.active{display:block}
.hero{min-height:72vh}
h1{letter-spacing:-2px}
}
</style>
</head>

<body>

<header class="header">
  <div class="navbar">
    <a class="logo" href="index.html">Clinelia</a>

    <nav class="nav">
      <a href="index.html">Introduksjon</a>
      <a href="info.html">Informasjon</a>
      <a href="contact.html">Send Email</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Service</a>
      <a class="download" href="#">Last ned appen</a>
    </nav>

    <button class="menu-btn" onclick="openMenu()">☰</button>
  </div>
</header>

<div class="mobile-menu" id="mobileMenu">
  <div class="mobile-top">
    <a class="logo" href="index.html">Clinelia</a>
    <button class="close" onclick="closeMenu()">×</button>
  </div>

  <div class="mobile-links">
    <a href="index.html">Introduksjon</a>
    <a href="info.html">Informasjon</a>
    <a href="privacy.html">Privacy</a>
    <a href="terms.html">Service</a>
  </div>

  <div class="mobile-download">
    <p>Last ned appen</p>
    <a class="ios-btn" href="#"> Download for iOS</a>
  </div>
</div>

<main class="hero">
  <section class="hero-card">
    <h1>Velkommen til Clinelia</h1>
    <p>Moderne helseløsning gjort enkelt.</p>

    <div class="actions">
      <a class="btn btn-dark" href="#">Last ned appen</a>
      <a class="btn btn-light" href="info.html">Les mer</a>
    </div>
  </section>
</main>

<footer class="footer">© 2026 Clinelia. Alle rettigheter reservert.</footer>

<script>
function openMenu(){document.getElementById("mobileMenu").classList.add("active")}
function closeMenu(){document.getElementById("mobileMenu").classList.remove("active")}
</script>

</body>
</html>
